models:
  - name: stg_supplies
    description: >
      List of our supply expenses data with basic cleaning and transformation applied.

      One row per supply cost, not per supply. As supply costs fluctuate they receive a new row with a new UUID. Thus there can be multiple rows per supply_id.
    columns:
      - name: supply_uuid
        description: The unique key of our supplies per cost.
        data_tests:
          - not_null
          - unique
      - name: supply_id
        description: "Natural identifier of the supply (repeats across cost changes)."
      - name: product_id
        description: "The product (SKU) this supply is an ingredient of."
      - name: supply_name
        description: "Display name of the supply."
      - name: supply_cost
        description: "Cost of the supply, in dollars."
      - name: is_perishable_supply
        description: "True when the supply is perishable."
