models:
  - name: locations
    description: >
      Location dimension mart — one row per physical store location, with the store's tax rate
      and opening date. Not part of a published data product, so no enforced contract.
    columns:
      - name: location_id
        description: Surrogate primary key — one row per location.
        data_tests:
          - not_null
          - unique
      - name: location_name
        description: Display name of the store location.
      - name: tax_rate
        description: Sales tax rate applied at this location (fraction, e.g. 0.0825).
      - name: opened_date
        description: The date the location opened (derived from the raw opened_at timestamp).

semantic_models:
  - name: locations
    description: |
      Location dimension table. The grain of the table is one row per location.
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: opened_date
        expr: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate
        description: Average tax rate.
        expr: tax_rate
        agg: average
