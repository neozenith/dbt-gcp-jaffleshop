config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.10.0"


profile: jaffle_shop

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  "dbt_date:time_zone": "Australia/Melbourne"

  # Empty default required so clean_slice.sql can call var('git_branch') without an explicit fallback.
  # Override on the CLI when running locally without DBT_CLOUD_GIT_BRANCH / DBT_GIT_BRANCH / GIT_BRANCH:
  #   uv run dbt run --vars "git_branch: $(git rev-parse --abbrev-ref HEAD)"
  "git_branch": ""

seeds:
  jaffle_shop:
    +database: jaffleshop
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"

models:
  jaffle_shop:
    +database: jaffleshop
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
