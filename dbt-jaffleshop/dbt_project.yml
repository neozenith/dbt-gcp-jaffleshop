config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=1.10.0"


profile: jaffle_shop

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  "dbt_date:time_zone": "Australia/Melbourne"

  # Empty default required so clean_slice.sql can call var('git_branch') without an explicit fallback.
  # Override on the CLI when running locally without DBT_CLOUD_GIT_BRANCH / DBT_GIT_BRANCH / GIT_BRANCH:
  #   uv run dbt run --vars "git_branch: $(git rev-parse --abbrev-ref HEAD)"
  "git_branch": ""

  # Elementary observability is PROD-ONLY. dev/test are ephemeral (24h-TTL, PR-sliced), so
  # persisting run/test telemetry there is noise. The elementary models are gated off below
  # (+enabled), and these vars mute Elementary's on-run-end upload hooks in non-prod — otherwise
  # a non-prod `dbt seed`/`build` would try to write artifacts into the (now-absent) elementary
  # tables and fail. Elementary's get_config_var coerces the rendered "True"/"False" string back
  # to a real bool. The env check mirrors data_environment() (DBT_ENV_TYPE wins, else target.name;
  # prod builds set DBT_ENV_TYPE=PROD) because dbt_project.yml Jinja can't call project macros.
  "disable_dbt_artifacts_autoupload": "{{ env_var('DBT_ENV_TYPE', target.name) | upper != 'PROD' }}"
  "disable_run_results": "{{ env_var('DBT_ENV_TYPE', target.name) | upper != 'PROD' }}"
  "disable_tests_results": "{{ env_var('DBT_ENV_TYPE', target.name) | upper != 'PROD' }}"
  "disable_dbt_invocation_autoupload": "{{ env_var('DBT_ENV_TYPE', target.name) | upper != 'PROD' }}"
  "disable_freshness_results": "{{ env_var('DBT_ENV_TYPE', target.name) | upper != 'PROD' }}"

# Ephemeral-data hygiene: in NON-prod targets (dev / test — including the PR-sliced datasets CI
# spins up), every dbt-created table gets a 24h BigQuery expiry so they self-clean; prod tables are
# permanent. `{{ 24 if … else none }}` renders to "24" for dev/test and "" otherwise, and
# dbt-bigquery treats an empty/falsy `hours_to_expiration` as "no expiration". (Views ignore it.)
seeds:
  jaffle_shop:
    +database: jaffleshop
    +schema: raw
    +hours_to_expiration: "{{ 24 if target.name in ['dev', 'test'] else none }}"
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"

models:
  jaffle_shop:
    +database: jaffleshop
    +hours_to_expiration: "{{ 24 if target.name in ['dev', 'test'] else none }}"
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

  # Elementary observability models — their own `elementary` schema, same GCP project as our models
  # (+database is mandatory: generate_database_name enforces an explicit custom database per model).
  # No TTL/materialized overrides here: Elementary manages its own (incremental) materializations.
  elementary:
    +database: jaffleshop
    +schema: elementary
    # PROD-only: dev/test are ephemeral, so Elementary's models are disabled there (and its
    # upload hooks are muted via the disable_* vars above). The restricted +enabled Jinja context
    # can't call data_environment(), so inline the same DBT_ENV_TYPE→target.name fallback. This
    # also treats the `prod-impersonate` target (gha-docs / elementary-report) as prod.
    +enabled: "{{ env_var('DBT_ENV_TYPE', target.name) | upper == 'PROD' }}"
