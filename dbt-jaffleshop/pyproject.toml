[project]
name = "jaffle-shop"
version = "3.0.0"
description = "Canonical dbt jaffle-shop example, wired for BigQuery."
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.11.1",
    "dbt-core>=1.11.10",
    "jafgen>=0.4.12",
    "requests~=2.31.0",
]

[dependency-groups]
dev = [
    # adaf — the Automated Data Assurance Framework CLI, consumed as an editable path dep so it runs
    # INSIDE this project's venv where dbt / sqlfluff / dbt-autofix are on PATH (the shell-out checks
    # need them). Developed + tested standalone at .github/cli/adaf. See ADR-0005.
    "adaf",
    # obs — the observability CLI (Elementary run telemetry → Gantt viewer), consumed as an
    # editable path dep so `uv run obs` runs inside this project's venv. The dbt-docs Pages job
    # builds the viewer here (authed as dbt-prod via WIF → obs uses --no-impersonate). Developed
    # + tested standalone at .github/cli/obs.
    "obs",
    "dbt-autofix>=0.20.5",
    "elementary-data[bigquery]==0.24.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sqlfluff>=4.2.1",
    "sqlfluff-templater-dbt>=4.2.1",
]

[tool.uv.sources]
adaf = { path = "../.github/cli/adaf", editable = true }
obs = { path = "../.github/cli/obs", editable = true }

[tool.pytest.ini_options]
testpaths = ["pytests"]
# xdist: each test shells out to `uv run dbt …` (~3-5s of cold-start per case), so the suite is
# wall-clock-bound, not CPU-bound — parallelism gives ~Nx speedup. `auto` = os.cpu_count().
# Override with `-n0` on the CLI for single-test debugging to skip worker startup.
addopts = "-n auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
