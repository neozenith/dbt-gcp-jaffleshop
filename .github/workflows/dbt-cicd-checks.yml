name: dbt jaffle-shop CI - checks

# =============================================================================
# Runs `adaf check all` (deprecations, lint, format, docs, doc-columns, tests, taxonomy,
# system-boundaries — adaf is the Automated Data Assurance Framework CLI, a path dev-dep of the project)
# over the PR and posts a single, self-updating comment summarising the result —
# with a link to THIS run's logs, where the full per-file / per-violation detail
# lives. The comment is the at-a-glance digest; the logs are the source of truth.
#
# Auth: Workload Identity Federation → dbt-test SA (the same provider deploy-test
# uses). lint/format need a BigQuery connection (the sqlfluff dbt templater) and
# `doc-columns` reads catalog.json from `dbt docs generate`, so a warehouse identity
# is required — fake project IDs are not enough here.
#
# NB on `doc-columns`: `dbt docs generate` only catalogues relations that EXIST in the
# warehouse. This workflow does not build the models, so on a PR with no prior
# build `doc-columns` will report "not in catalog". For accurate column coverage, add
# a `dbt build` step before docs-generate, or run the checks after deploy-test's
# build (same run → same slice).
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'dbt-jaffleshop/**'
      - '.github/cli/adaf/**'
      - '.github/workflows/dbt-cicd-checks.yml'

permissions:
  contents: read
  id-token: write          # WIF (google-github-actions/auth)
  pull-requests: write      # post / update the summary comment

concurrency:
  group: dbt-cicd-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dbt-jaffleshop

jobs:
  checks:
    name: adaf check all
    runs-on: ubuntu-latest
    environment: test         # binds vars.WIF_PROVIDER + env protection rules
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_TARGET: test
      DBT_ENV_TYPE: TEST
      DBT_BQ_PROJECT_TEST: dbt-test-jaffleshop
      # sqlfluff's dbt templater renders the FULL profiles.yml (every output), so the dev/prod
      # project vars must resolve even though we only build the test target. They have no default
      # in profiles.yml (wrong-project writes must fail loud), so fake values satisfy env_var() here.
      DBT_BQ_PROJECT_DEV: fake-gcp-project-dev
      DBT_BQ_PROJECT_PROD: fake-gcp-project-prod
      # A slice is mandatory in non-PROD (generate_schema_name errors otherwise).
      DBT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      SUMMARY: ${{ github.workspace }}/checks-summary.md
      COMMENT: ${{ github.workspace }}/comment.md

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0       # base ref reachable, in case --changed-only is used later

      - name: Authenticate to GCP (WIF → dbt-test SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: dbt-test@dbt-test-jaffleshop.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Install Python deps
        run: uv sync

      # Build the slice so doc-columns has a REAL catalog (resolved warehouse columns). Without a
      # build the catalog is empty and doc-columns reports "not in catalog" for every model. seed
      # loads RAW; build materialises models + runs tests (incl. enforced contracts).
      - name: dbt deps + seed + build
        run: |
          uv run dbt deps
          uv run dbt seed --target test --vars '{"load_source_data": true}'
          uv run dbt build --target test

      # Now the sliced datasets exist, so catalog.json resolves every model's columns (doc-columns).
      - name: dbt docs generate (manifest + catalog)
        run: uv run dbt docs generate --target test

      # Every gate over all models. --md writes the comment table; full detail stays in the logs.
      # continue-on-error so the comment is always posted; the final step sets the real status.
      - name: adaf check all
        id: checks
        run: uv run adaf check all --all --color never --md "${SUMMARY}"
        continue-on-error: true

      - name: Compose comment body
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "<!-- adaf-checks -->"
            if [ -s "${SUMMARY}" ]; then
              cat "${SUMMARY}"
            else
              echo "### adaf checks — ❌ failed before a summary could be produced"
            fi
            echo ""
            echo "**[View full check logs →](${RUN_URL})**  ·  _updated $(date -u +%Y-%m-%dT%H:%M:%SZ)_"
          } > "${COMMENT}"

      # Self-updating ("sticky") comment: find the prior one by its marker and PATCH it, else POST.
      - name: Post / update PR comment
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          body="$(cat "${COMMENT}")"
          existing="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- adaf-checks -->")) | .id' | head -n1)"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="${body}" >/dev/null
            echo "Updated comment ${existing}"
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="${body}" >/dev/null
            echo "Created comment"
          fi

      - name: Reflect check status
        if: always() && steps.checks.outcome == 'failure'
        run: |
          echo "::error::adaf checks failed — see the PR comment and the logs above." >&2
          # exit 1
