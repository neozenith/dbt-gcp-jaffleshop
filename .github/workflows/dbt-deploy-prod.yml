name: dbt deploy / prod

# =============================================================================
# PROD deploys (split out from the former dbt-deploy.yml; test lives in
# dbt-deploy-test.yml).
#
# Routing (matches the SA scoping in infra/stacks/dbt_platform/dbt.tf):
#   - push to main                    → `parse` only (validation; no deploy)
#   - push tag v*                     → `parse` then `deploy / prod` (single build)
#   - workflow_dispatch (from main)   → `parse` then `deploy / prod`
#       · thread_sweep=false (default) → single `dbt build` (normal deploy)
#       · thread_sweep=true            → sweep `dbt build --threads N` over thread_sweep_set,
#                                        each a distinct Elementary invocation, to curate
#                                        run telemetry for the `obs` Gantt viewer. Off by
#                                        default so normal deploys aren't multiplied; use a
#                                        larger `runner` input for clean high-thread (>4) data.
#
# The IAM condition on the dbt-prod WIF binding additionally restricts push
# events to refs/tags/* — branch pushes can't impersonate even if the workflow
# gate misfires.
#
# Slice: PROD takes no slice prefix. data_environment resolves to PROD (set
# explicitly via DBT_ENV_TYPE) and clean_slice returns empty in the PROD branch
# of generate_schema_name, so datasets are unprefixed (RAW, STAGING, …).
#
# Auth: Workload Identity Federation only; no keyfiles.
# =============================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'dbt-jaffleshop/**'
      - '.github/workflows/dbt-deploy-prod.yml'
  workflow_dispatch:
    inputs:
      thread_sweep:
        description: "Run the dbt-build thread-permutation sweep (curates obs Gantt telemetry). OFF for normal deploys."
        type: boolean
        default: false
      thread_sweep_set:
        description: "Space-separated thread counts to sweep when thread_sweep is on."
        type: string
        default: "1 2 4 8 16 32"
      runner:
        description: "Runner label. Bump to a larger runner for clean high-thread (>4) sweeps; standard runners are ~2-4 cores."
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read
  id-token: write          # required for WIF (google-github-actions/auth)

# Serialize ALL prod deploys into ONE group — NOT per-ref. Every deploy (tag push,
# main dispatch, the thread sweep) runs `dbt run -s elementary` / `dbt build`, which
# writes the Elementary incremental models in the shared ELEMENTARY dataset using
# fixed-name temp tables (e.g. dbt_sources__dbt_tmp). A per-ref group let a tag deploy
# and a main dispatch run concurrently; they collided on that temp table and one run
# 404'd ("Not found: ELEMENTARY.dbt_sources__dbt_tmp"). A single ref-independent group
# makes them queue instead. cancel-in-progress: false lets the in-flight deploy finish
# (never kill a half-written prod build).
concurrency:
  group: dbt-deploy-prod
  cancel-in-progress: false

defaults:
  run:
    working-directory: dbt-jaffleshop

jobs:
  # ---------------------------------------------------------------------------
  # Fast static validation gate. Runs on every trigger (incl. main pushes that
  # never deploy); deploy depends on it. No cloud auth — fake DBT_BQ_PROJECT_*
  # values satisfy env_var() in profiles.yml.
  # ---------------------------------------------------------------------------
  parse:
    name: dbt parse (validate)
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_BQ_PROJECT_DEV: fake-gcp-project-dev
      DBT_BQ_PROJECT_TEST: fake-gcp-project-test
      DBT_BQ_PROJECT_PROD: fake-gcp-project-prod
      DBT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      - name: dbt parse
        run: uv run dbt parse

  # ---------------------------------------------------------------------------
  # Deploy to PROD via dbt-prod SA (WIF on tag-push or workflow_dispatch only).
  #
  # latest/manifest.json is overwritten on every successful run. It is the defer
  # baseline that dbt-deploy-test.yml's slim build pulls (state:modified+ --defer)
  # and that `make build-defer` / `make clone` consume locally.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: deploy / prod
    needs: parse
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Runner is dispatch-selectable so a deliberate high-thread sweep can request a larger
    # runner; tag-push deploys fall back to the standard ubuntu-latest.
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    environment: prod          # required reviewers + deployment branches enforced here
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_TARGET: prod
      DBT_ENV_TYPE: PROD       # explicit; decouples env from target.name in data_environment
      DBT_BQ_PROJECT_PROD: dbt-prod-jaffleshop
      # DBT_BQ_DATASET_PROD left unset — profiles.yml default 'analytics' applies.
      # No DBT_PR_ID / DBT_RUN_ID / DBT_GIT_BRANCH — PROD is unsliced.

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF → dbt-prod SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: dbt-prod@dbt-prod-jaffleshop.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      # Bootstrap Elementary's models first so its result tables exist before any other
      # invocation's on-run-end hook logs to them (the `dbt seed` step's elementary hook
      # errors if they're missing). This is a plain incremental run; a forced --full-refresh
      # is an occasional maintenance task, moved to the dispatch-only
      # .github/workflows/elementary-full-refresh.yml instead of every deploy.
      #
      # Normal deploys run a SINGLE `dbt build`. The thread-permutation sweep is a
      # FEATURE-FLAGGED, dispatch-only data-generation mode (off by default):
      #
      #   workflow_dispatch → thread_sweep=true (+ thread_sweep_set, runner)
      #
      # When enabled, `dbt build` runs once per thread count in the set. dbt build is
      # idempotent on prod data, so each pass rebuilds the same models at a different
      # parallelism, and Elementary logs each as its OWN invocation_id (with `threads`
      # in dbt_invocations) — curating a spread of run telemetry for the `obs` Gantt to
      # compare. `--threads N` overrides the profile. Note: dbt+BigQuery threads are
      # I/O-bound (each blocks on a BQ job), so high counts still issue N concurrent BQ
      # queries on a small runner; the runner cores only cap dbt's local work. For a
      # CLEAN high-thread benchmark, dispatch with a larger `runner`. The LAST pass leaves
      # target/ for the artefact upload below.
      - name: run dbt build
        env:
          THREAD_SWEEP: ${{ github.event.inputs.thread_sweep || 'false' }}
          THREAD_SWEEP_SET: ${{ github.event.inputs.thread_sweep_set || '1 2 4 8 16 32' }}
        run: |
          uv run dbt run -s elementary --target prod
          uv run dbt seed --target prod --vars '{"load_source_data": true}'
          if [ "$THREAD_SWEEP" = "true" ]; then
            echo "Thread-permutation sweep ENABLED — set: $THREAD_SWEEP_SET"
            for N in $THREAD_SWEEP_SET; do
              echo "::group::dbt build --threads $N"
              uv run dbt build --threads "$N" --target prod
              echo "::endgroup::"
            done
          else
            uv run dbt build --target prod
          fi

      - name: Upload dbt artefacts to GCS (runs/<id> + latest)
        if: always()
        run: |
          BUCKET=gs://dbt-prod-jaffleshop-dbt-artefacts
          RUN_PREFIX=runs/${{ github.run_id }}
          for f in manifest.json run_results.json catalog.json; do
            if [ -f "target/$f" ]; then
              gcloud storage cp "target/$f" "$BUCKET/$RUN_PREFIX/$f"
            fi
          done
          # Only refresh latest/manifest.json on successful runs — slim CI
          # consumers downstream rely on it being a known-good baseline.
          if [ "${{ job.status }}" = "success" ] && [ -f "target/manifest.json" ]; then
            gcloud storage cp target/manifest.json "$BUCKET/latest/manifest.json"
          fi
