name: dbt deploy

# =============================================================================
# Routing (matches the SA scoping in infra/dbt.tf):
#   - push to feature branch          → nothing (no trigger matches)
#   - PR draft (infra/** untouched)   → `parse` only
#   - PR ready-for-review             → `parse` then `deploy / test`
#   - push to main                    → `parse` only (validation; no deploy)
#   - push tag v*                     → `parse` then `deploy / prod`
#   - workflow_dispatch (from main)   → `parse` then `deploy / prod`
#
# Dev is NOT a CI target by design — dbt-dev SA has no WIF binding (humans-only
# per infra/dbt.tf). Local devs use `make deploy-dev` to run dbt against dev via
# gcloud impersonation. The CI here covers test + prod only.
#
# Auth: every cloud-touching job uses Workload Identity Federation; no keyfiles
# anywhere. `google-github-actions/auth@v3` writes ADC to disk and dbt-bigquery's
# `method: oauth` (in profiles.yml) reads it transparently.
#
# Slim CI deferred for v1 — once prod has uploaded a baseline manifest.json to
# its artefacts bucket, the test job can add:
#   - download gs://dbt-prod-jaffleshop-dbt-artefacts/latest/manifest.json
#   - dbt build --select state:modified+ --defer --state ./prod-artifacts
# That's the only meaningful change needed for slim CI later.
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'dbt-jaffleshop/**'
      - '.github/workflows/dbt-deploy.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'dbt-jaffleshop/**'
      - '.github/workflows/dbt-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required for WIF (google-github-actions/auth)

# Serialize per-ref so two pushes to the same branch don't deploy in parallel.
# `cancel-in-progress: false` lets in-flight builds finish — half-written
# warehouse state would be worse than a queued deploy.
concurrency:
  group: dbt-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: dbt-jaffleshop

jobs:
  # ---------------------------------------------------------------------------
  # Fast static validation gate. Runs on every trigger; deploys depend on it.
  # No cloud auth — fake DBT_BQ_PROJECT_* values satisfy env_var() in profiles.yml.
  # Catches: dbt project syntax errors, missing refs, broken macros, bad sources.
  # ---------------------------------------------------------------------------
  parse:
    name: dbt parse (validate)
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_BQ_PROJECT_DEV: fake-gcp-project-dev
      DBT_BQ_PROJECT_TEST: fake-gcp-project-test
      DBT_BQ_PROJECT_PROD: fake-gcp-project-prod
      DBT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      - name: dbt parse
        run: uv run dbt parse

  # ---------------------------------------------------------------------------
  # Deploy to TEST via dbt-test SA (WIF on pull_request events only).
  # Per generate_schema_name.sql + clean_slice.sql, each PR run lands in a
  # schema prefixed by PR<n>_RUN<run_id>__ so concurrent PRs don't collide.
  # ---------------------------------------------------------------------------
  deploy-test:
    name: deploy / test
    needs: parse
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: test          # binds vars.WIF_PROVIDER + GH env protection rules
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_TARGET: test
      DBT_BQ_PROJECT_TEST: dbt-test-jaffleshop
      # DBT_BQ_DATASET_TEST left unset — profiles.yml default + generate_schema_name
      # macro rewrite handle dataset naming. data_environment defaults to target.name.
      DBT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      DBT_CLOUD_PR_ID: ${{ github.event.pull_request.number }}
      DBT_CLOUD_RUN_ID: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF → dbt-test SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: dbt-test@dbt-test-jaffleshop.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      - name: dbt seed (test)
        run: |
          uv run dbt seed --target test --vars '{"load_source_data": true}'

      - name: dbt build (test)
        run: uv run dbt build --target test

      # `if: always()` ensures artefacts upload even when the build fails — the
      # failed run_results.json is exactly what we want for post-mortem.
      - name: Upload dbt artefacts to GCS
        if: always()
        run: |
          BUCKET=gs://dbt-test-jaffleshop-dbt-artefacts
          RUN_PREFIX=runs/${{ github.run_id }}
          for f in manifest.json run_results.json catalog.json; do
            if [ -f "target/$f" ]; then
              gcloud storage cp "target/$f" "$BUCKET/$RUN_PREFIX/$f"
            fi
          done

  # ---------------------------------------------------------------------------
  # Deploy to PROD via dbt-prod SA (WIF on tag-push or workflow_dispatch only).
  # IAM condition on the WIF binding additionally restricts push events to
  # refs/tags/* — branch pushes can't impersonate even if the workflow gate misfires.
  #
  # `latest/manifest.json` is overwritten on every successful run so the next
  # PR's deploy-test can `gcloud storage cp` it as the slim-CI defer state.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: deploy / prod
    needs: parse
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: prod          # required reviewers + deployment branches enforced here
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_TARGET: prod
      DBT_BQ_PROJECT_PROD: dbt-prod-jaffleshop
      # DBT_BQ_DATASET_PROD left unset — profiles.yml default 'analytics' applies.
      # data_environment defaults to target.name → PROD; clean_slice returns empty
      # in PROD branch of generate_schema_name, so no slice prefix.

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF → dbt-prod SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: dbt-prod@dbt-prod-jaffleshop.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      - name: dbt seed (prod)
        run: |
          uv run dbt seed --target prod --vars '{"load_source_data": true}'
          
      - name: dbt build (prod)
        run: uv run dbt build --target prod

      - name: Upload dbt artefacts to GCS (runs/<id> + latest)
        if: always()
        run: |
          BUCKET=gs://dbt-prod-jaffleshop-dbt-artefacts
          RUN_PREFIX=runs/${{ github.run_id }}
          for f in manifest.json run_results.json catalog.json; do
            if [ -f "target/$f" ]; then
              gcloud storage cp "target/$f" "$BUCKET/$RUN_PREFIX/$f"
            fi
          done
          # Only refresh `latest/manifest.json` on successful runs — slim CI
          # consumers downstream rely on it being a known-good baseline.
          if [ "${{ job.status }}" = "success" ] && [ -f "target/manifest.json" ]; then
            gcloud storage cp target/manifest.json "$BUCKET/latest/manifest.json"
          fi
