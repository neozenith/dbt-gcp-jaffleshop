name: dbt jaffle-shop CI - macro tests
on:
  # Manual trigger for ad-hoc verification (e.g. after fixing the workflow itself).
  workflow_dispatch:
  # Push checks: only on merge to main
  push:
    branches:
      - main
    paths:
      - .github/workflows/dbt-cicd-macros.yml
      - dbt-jaffleshop/macros/custom_naming/**
      - dbt-jaffleshop/macros/generate_schema_name.sql
      - dbt-jaffleshop/macros/generate_database_name.sql
      - dbt-jaffleshop/pytests/**
  # PR checks: only when a PR (or draft PR) is open
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/dbt-cicd-macros.yml
      - dbt-jaffleshop/macros/custom_naming/**
      - dbt-jaffleshop/macros/generate_schema_name.sql
      - dbt-jaffleshop/macros/generate_database_name.sql
      - dbt-jaffleshop/pytests/**

permissions:
  contents: read

# Per (Workflow, branch) combination, only one job has preference. Prevents push and pull_request from racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: true

# These fake values let dbt parse/compile resolve profiles.yml templating without authenticating to a real GCP project.
# The macros under test only need the manifest to render — no warehouse round-trips.
# DBT_GIT_BRANCH feeds clean_slice.sql so generate_schema_name can produce a non-PROD slice without erroring.
env:
  DBT_BQ_PROJECT_DEV: fake-gcp-project-dev
  DBT_BQ_PROJECT_TEST: fake-gcp-project-test
  DBT_BQ_PROJECT_PROD: fake-gcp-project-prod
  DBT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  basic-checks:
    name: Python and dbt formatting / linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt-jaffleshop

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python dependencies
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      # TODO: re-enable once a dedicated read-only lint SA exists.
      # sqlfluff uses the dbt templater (sqlfluff-templater-dbt), which always calls
      # `adapter.set_relations_cache()` — that opens a real BigQuery connection and lists
      # datasets in the project. Locally that works via gcloud ADC; in CI it crashes with
      # `AttributeError: 'NoneType' object has no attribute 'close'` because there's no auth.
      # The fix is WIF auth for this step, but we explicitly do NOT want to reuse the
      # terraform-deployer SA — sqlfluff lint should impersonate a least-privilege read-only SA.
      # Until that SA is bootstrapped, lint runs only locally (`make lint`).
      # - name: SqlFluff lint
      #   run: uv run sqlfluff lint models/

  dbt-project-health:
    name: dbt parse + compile
    runs-on: ubuntu-latest
    needs: basic-checks
    defaults:
      run:
        working-directory: dbt-jaffleshop

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python dependencies
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      # `dbt compile` is intentionally omitted: BigQuery adapter eagerly opens a connection
      # to resolve refs, which fails in CI without ADC/Workload Identity Federation. Until WIF
      # is wired up, `dbt parse` alone validates project structure + our custom-naming macros.
      # DBT_GIT_BRANCH is set at the workflow env level.
      - name: dbt parse
        run: uv run dbt parse

  test-macros:
    name: pytest macro tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    needs: dbt-project-health
    defaults:
      run:
        working-directory: dbt-jaffleshop

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python dependencies
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Run pytest
        run: uv run pytest
