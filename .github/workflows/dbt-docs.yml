name: dbt docs

# =============================================================================
# Publishes the dbt documentation site to GitHub Pages whenever "prod" happens.
#
# "Prod" is defined identically to the deploy-prod job in dbt-deploy-prod.yml:
#   - push tag v*                     → build + publish docs
#   - workflow_dispatch (from main)   → build + publish docs
#   - anything else                   → no trigger matches
#
# Docs reflect the LIVE prod warehouse. `dbt docs generate` runs catalog queries
# against BigQuery INFORMATION_SCHEMA, so the build job authenticates as the same
# dbt-prod SA (via WIF) that deploy-prod uses — that's what fills in column types,
# row counts, and table sizes. Without it the catalog would be empty.
#
# This workflow is decoupled from dbt-deploy-prod.yml on purpose: it queries whatever
# state the warehouse is currently in, so it does not need to wait on the deploy
# job. On a fresh tag the deploy and docs runs race harmlessly — docs just
# document the warehouse as it stands when the catalog query runs.
#
# Auth: Workload Identity Federation only; no keyfiles. The dbt-prod WIF binding
# (infra/stacks/dbt_platform/dbt.tf) already permits tag pushes + workflow_dispatch from main.
#
# Site format: `dbt docs generate --static` emits a single self-contained
# target/static_index.html (all assets + manifest + catalog inlined). We publish
# that one file as index.html — no sibling JSON fetch, no exposed compiled/ SQL.
#
# Alongside it we publish the sdag data-product lineage viewer (sdag.html + sdag.js +
# full_graph.json + super_graph.json) as SIBLING files, reachable at <pages-url>/sdag.html.
# `products generate` reads the manifest.json that `dbt docs generate` writes (it's still
# emitted under --static) and resolves data-product membership via `dbt ls` (parse-only).
# The emitted JSONs carry only graph metadata (node names, resource types, tags, lineage,
# selector membership) — NOT compiled SQL — so they keep the same "no exposed SQL" stance.
#
# We ALSO publish the Elementary observability dashboard (elementary_report.html) as a third
# SIBLING, reachable at <pages-url>/elementary_report.html. `edr report` reads the Elementary
# telemetry tables in dbt-prod-jaffleshop.ELEMENTARY (run/test results, model run-times,
# anomaly history — written on every prod test run via the re-exported test materialization)
# and renders one self-contained HTML file. NOTE: edr is NOT a read-only tool — it creates and
# drops intermediate tables in ELEMENTARY while assembling the report. Here that is fine: the
# step runs as the dbt-prod SA already authenticated for the catalog query, which has write on
# its own project. (The LOCAL `make elementary-report` path instead impersonates a dedicated,
# narrowly-scoped dbt-dev-elementary SA — see dbt-jaffleshop/Makefile and infra/stacks/dbt_platform/dbt.tf.)
#
# We ALSO publish the obs viewer (obs.html + obs.js + design-tokens.json + index.json +
# runs/*.json) under <pages-url>/obs/. It extracts the last 30 days of prod Elementary run telemetry
# (dbt_run_results + dbt_invocations) into a 2-page SPA: an overview Plotly scatter (run time ×
# duration, coloured pass/fail) that deep-links (?run=<id>) into each run's thread-grouped Gantt —
# letting you compare parallelism across the thread-permutation sweep (see dbt-deploy-prod.yml). It
# reads ELEMENTARY as the dbt-prod SA (--no-impersonate); the emitted JSON carries only run timings +
# node names (no compiled SQL), matching the "no exposed SQL" stance of the siblings above.
#
# Finally we publish the MkDocs "guides" site as a FIFTH SIBLING, reachable at <pages-url>/guides/.
# It renders docs/guides/testing_taxonomy/ (the dbt testing-taxonomy catalogue) as a Material static
# site. Unlike the three siblings above, this build needs NO warehouse query and NO GCP auth — it is a
# pure markdown→HTML build from an isolated mkdocs-material env under docs/site/. It is folded into this
# job (rather than its own workflow) for one structural reason: GitHub Pages serves a SINGLE artifact,
# so every published surface must be staged into the one _site/ tree this job uploads. A parallel
# workflow would race this one and clobber the deployment. Config + env live in docs/site/.
#
# PREREQUISITE: repo Settings → Pages → Source must be set to "GitHub Actions"
# (one-time, manual). The deploy-pages action fails clearly if it isn't.
# =============================================================================

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Default to read-only; each job widens only what it needs.
permissions:
  contents: read

# Serialize Pages publishes. cancel-in-progress: false matches dbt-deploy-prod.yml's
# stance — let an in-flight publish finish rather than risk a half-swapped site.
concurrency:
  group: dbt-docs-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: dbt-jaffleshop

jobs:
  # ---------------------------------------------------------------------------
  # Build: authenticate to prod, generate the static docs site, upload it as a
  # Pages artifact. Holds id-token (for WIF) but NOT pages:write.
  # ---------------------------------------------------------------------------
  build:
    name: dbt docs generate (prod catalog)
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: prod          # same required-reviewers / branch gate as deploy-prod
    permissions:
      contents: read
      id-token: write          # required for WIF (google-github-actions/auth)
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_TARGET: prod
      DBT_BQ_PROJECT_PROD: dbt-prod-jaffleshop
      # DBT_BQ_DATASET_PROD left unset — profiles.yml default 'analytics' applies.

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF → dbt-prod SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: dbt-prod@dbt-prod-jaffleshop.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      # --static inlines manifest + catalog into a single static_index.html.
      - name: dbt docs generate (prod, static)
        run: uv run dbt docs generate --target prod --static

      # Stage just the self-contained file as the site root. `uses:` steps ignore
      # defaults.run.working-directory, so upload-pages-artifact reads from the
      # workspace root — stage there, not under dbt-jaffleshop/.
      - name: Stage static docs site
        run: |
          mkdir -p "${{ github.workspace }}/_site"
          cp target/static_index.html "${{ github.workspace }}/_site/index.html"

      # Build the sdag data-product lineage viewer straight into _site so its assets land as siblings of
      # index.html (→ <pages-url>/sdag.html). Reads target/manifest.json from the generate step above;
      # `dbt ls` membership resolution is parse-only, so the prod env already set on this job is enough
      # (no warehouse query). Fail-loud (no `|| true`) to match the docs-generate step's stance.
      - name: Build sdag data-product viewer (sibling of index.html)
        run: uv run adaf sdag generate -o "${{ github.workspace }}/_site"

      # Elementary observability dashboard → <pages-url>/elementary_report.html. Runs as the
      # dbt-prod SA authenticated above (edr materializes scratch tables in ELEMENTARY, so it
      # needs prod write — which dbt-prod has on its own project). edr loads ONLY the
      # `elementary` profile, so DBT_BQ_PROJECT_PROD (set on this job) is the only project var
      # it reads; DBT_BQ_DATASET_ELEMENTARY defaults to ELEMENTARY. Fail-loud (no `|| true`).
      - name: Build Elementary report (sibling of index.html)
        run: |
          uv run edr report \
            --profiles-dir "${{ github.workspace }}/dbt-jaffleshop" \
            --profile-target prod \
            --target-path "${{ github.workspace }}/edr_target" \
            --file-path "${{ github.workspace }}/_site/elementary_report.html"

      # obs viewer → <pages-url>/obs/obs.html. Extracts the last 30 days of prod
      # Elementary run telemetry (dbt_run_results + dbt_invocations) into index.json + per-run
      # JSON and a vanilla-JS Gantt viewer. Runs as the dbt-prod SA authenticated above, so it
      # reads ELEMENTARY directly — hence --no-impersonate (the LOCAL path instead impersonates
      # the dbt-dev-elementary SA; see .github/cli/obs/README.md). Output nests under _site/obs/
      # so its index.json/runs/ fetch relatively without touching index.html. Fail-loud.
      - name: Build obs Gantt viewer (sibling of index.html, under /obs/)
        run: uv run obs generate --no-impersonate -o "${{ github.workspace }}/_site/obs"

      # MkDocs guides site → <pages-url>/guides/. Renders docs/guides/testing_taxonomy/
      # as a Material static site (config + isolated mkdocs-material env live in docs/site/).
      # This is a PURE static build — no warehouse query, no GCP auth — so unlike the steps
      # above it doesn't depend on the prod SA; it's gated into this job only so the guides
      # republish on the same "prod" cadence and land in the SAME single Pages artifact.
      # `--directory docs/site` runs mkdocs in its own uv env (kept out of the dbt env synced
      # above); `--frozen` enforces docs/site/uv.lock. site_dir is overridden to _site/guides
      # so the output nests as a sibling of index.html without touching it (mkdocs cleans only
      # its own site_dir). Fail-loud: mkdocs.yml sets `strict: true`, so a broken internal
      # link or stale nav entry fails the publish instead of shipping a 404.
      - name: Build guides site (sibling of index.html, under /guides/)
        working-directory: ${{ github.workspace }}
        run: uv run --directory docs/site --frozen mkdocs build --site-dir "${{ github.workspace }}/_site/guides"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # ---------------------------------------------------------------------------
  # Deploy: publish the artifact to Pages. Holds pages:write but never touches
  # GCP. Skipped automatically when `build` is skipped (needs: build).
  # ---------------------------------------------------------------------------
  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write             # required to publish the Pages deployment
      id-token: write          # required by deploy-pages for its OIDC verification
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
