name: testing-taxonomy review

# =============================================================================
# Reviews dbt models against this project's testing taxonomy and upserts two sticky PR-comment
# coverage matrices (the PR's changed models AND all project models). Each comment carries
# token-usage + estimated cost, and a usage block is written to the run's job summary.
#
# The composite action .github/actions/dbt-testing-taxonomy-review is now a thin wrapper over
# `adaf review --post` (engine + rule catalogue + prompt live in .github/cli/adaf). This workflow
# just wires the PR context into it.
#
# LLM runner: GitHub Models — GitHub-hosted inference via the built-in GITHUB_TOKEN
# (permissions: models: read). No vendor API key, no secret, no Anthropic/OpenAI/Codex
# plugin — it leverages the GitHub subscription, matching the repo's keyless stance.
# Output is forced to review-output.schema.json (response_format json_schema, strict).
#
# Advisory only: it comments, it does not block merge.
# =============================================================================

# PR trigger DISABLED — the GitHub Models endpoint times out (TimeoutError) and the review
# engine's retry loop only catches HTTP errors (429), not socket timeouts, so a slow response
# fails the job. Tracked in docs/backlog/flaky-llm-review.md (root cause + fix + re-enable
# checklist). workflow_dispatch keeps it manually runnable until the retry fix lands; restore the
# `pull_request:` block below to re-enable on PRs.
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'dbt-jaffleshop/models/**'
  #     - '.github/actions/dbt-testing-taxonomy-review/**'
  #     - '.github/cli/adaf/**'
  #     - '.github/workflows/testing-taxonomy-review.yml'

# Least privilege: read the repo, call GitHub Models, write the PR comment.
permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: taxonomy-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review dbt models
    runs-on: ubuntu-latest
    # GITHUB_TOKEN on fork PRs is read-only (can't comment) and lacks models access.
    # Restrict to same-repo PRs so we fail clearly only on real errors, not perms.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # base..head diff needs both commits present

      - uses: ./.github/actions/dbt-testing-taxonomy-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ github.event.pull_request.base.sha }}
