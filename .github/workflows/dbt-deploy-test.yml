name: dbt deploy / test

# =============================================================================
# TEST deploys (split out from the former dbt-deploy.yml; prod lives in
# dbt-deploy-prod.yml). Runs ONLY in the context of a pull request.
#
# Routing (matches the SA scoping in infra/stacks/dbt_platform/dbt.tf):
#   - PR draft (or any PR event)      → `parse` only
#   - PR ready-for-review             → `parse` then `deploy / test`
#
# Slice: per clean_slice.sql, TEST is sliced by PR id + run id
# (DBT_PR_ID / DBT_RUN_ID), NOT by branch. We deliberately do NOT set
# DBT_GIT_BRANCH here: branch_slice takes precedence over the PR/RUN slice in
# clean_slice, so setting it would shadow DBT_PR_ID/DBT_RUN_ID and make them
# dead config. Omitting it lets the PR<n>_RUN<sha>__ dataset prefix take effect.
#
# Build strategy: SLIM. The deploy seeds the slice's RAW, then builds only
# state:modified+ vs the PROD baseline (latest/manifest.json), deferring unchanged
# upstream refs to live prod relations. See the build step for why the seed stays.
#
# Auth: Workload Identity Federation only; no keyfiles. auth@v3 writes ADC to
# disk and dbt-bigquery's `method: oauth` reads it transparently. The dbt-test SA
# reads prod BQ (cross_env_readers) + the prod artefacts bucket (cross-env GCS
# objectViewer) — both in infra/stacks/dbt_platform/dbt.tf.
# =============================================================================

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'dbt-jaffleshop/**'
      - '.github/workflows/dbt-deploy-test.yml'

permissions:
  contents: read
  id-token: write          # required for WIF (google-github-actions/auth)

# Serialize per-PR so two pushes to the same branch don't deploy in parallel.
# cancel-in-progress: false lets in-flight builds finish — half-written
# warehouse state would be worse than a queued deploy.
concurrency:
  group: dbt-deploy-test-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: dbt-jaffleshop

jobs:
  # ---------------------------------------------------------------------------
  # Fast static validation gate. Runs on every PR event; deploy depends on it.
  # No cloud auth — fake DBT_BQ_PROJECT_* values satisfy env_var() in profiles.yml.
  # Catches: dbt project syntax errors, missing refs, broken macros, bad sources.
  # ---------------------------------------------------------------------------
  parse:
    name: dbt parse (validate)
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_BQ_PROJECT_DEV: fake-gcp-project-dev
      DBT_BQ_PROJECT_TEST: fake-gcp-project-test
      DBT_BQ_PROJECT_PROD: fake-gcp-project-prod
      DBT_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      - name: dbt parse
        run: uv run dbt parse

  # ---------------------------------------------------------------------------
  # Deploy to TEST via dbt-test SA (WIF on pull_request events only).
  # Per generate_schema_name.sql + clean_slice.sql, each PR run lands in a
  # dataset prefixed by PR<n>_RUN<sha>__ so concurrent PRs / commits don't collide.
  # ---------------------------------------------------------------------------
  deploy-test:
    name: deploy / test
    needs: parse
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: test          # binds vars.WIF_PROVIDER + GH env protection rules
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt-jaffleshop
      DBT_TARGET: test
      DBT_ENV_TYPE: TEST       # explicit; decouples env from target.name in data_environment
      DBT_BQ_PROJECT_TEST: dbt-test-jaffleshop
      # DBT_BQ_DATASET_TEST left unset — profiles.yml default + generate_schema_name
      # macro rewrite handle dataset naming.
      #
      # NB: DBT_GIT_BRANCH deliberately NOT set — see header. branch_slice would
      # otherwise win over the PR/RUN slice in clean_slice.
      DBT_PR_ID: ${{ github.event.pull_request.number }}
      # Per-workflow run number: 1,2,3… monotonic and sequential (unlike the
      # huge non-sortable github.run_id), stable across re-runs of the same run
      # (re-runs bump run_attempt instead). The macro upper-cases it into the
      # PR<n>_RUN<n>__ dataset prefix. Not zero-padded — GHA expressions have no
      # printf/width function, and padding isn't worth a shell step here.
      DBT_RUN_ID: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF → dbt-test SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: dbt-test@dbt-test-jaffleshop.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt-jaffleshop/uv.lock"

      - name: Cache virtual environment
        uses: actions/cache@v5
        with:
          path: dbt-jaffleshop/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('dbt-jaffleshop/uv.lock') }}
          restore-keys: venv-${{ runner.os }}-

      - name: Install Python deps
        run: uv sync

      - name: Install dbt packages
        run: uv run dbt deps

      # Pull the known-good PROD manifest as the defer/state baseline. dbt-deploy-prod.yml
      # refreshes latest/manifest.json on every successful release; the dbt-test SA now has
      # storage.objectViewer on the prod bucket (dbt_artefacts_cross_env_viewer in
      # infra/stacks/dbt_platform/dbt.tf). Fails loud if absent — a slim build has no baseline
      # to compare against, and silently falling back to a full build would hide that.
      - name: Pull PROD state baseline
        run: |
          mkdir -p prod-state
          gcloud storage cp \
            gs://dbt-prod-jaffleshop-dbt-artefacts/latest/manifest.json \
            prod-state/manifest.json

      # Slim build: seed THEN build only what changed vs prod (and children), deferring every
      # unchanged upstream ref to the live PROD relation. Two things make this correct:
      #   • The seed is KEPT, not dropped: --defer redirects ref() only, never source(). Sources
      #     here are slice-prefixed (models/staging/__sources.yml → <SLICE>__RAW), so any rebuilt
      #     staging model reads the slice's RAW, which must be seeded to exist. Defer saves the
      #     unchanged staging+marts rebuilds (the expensive part), not the seed.
      #   • state:modified is accurate cross-env only because dbt_project.yml sets
      #     state_modified_compare_more_unrendered_values: true (else the prod↔slice schema
      #     difference flags every node). --favor-state prefers the prod relation for deferred
      #     refs over any stale same-named relation in the slice.
      # Elementary is PROD-only (disabled in dev/test via dbt_project.yml), so no bootstrap here.
      - name: run dbt build (slim, defer to prod)
        run: |
          uv run dbt seed --target test --vars '{"load_source_data": true}'
          uv run dbt build --target test \
            --select state:modified+ --defer --favor-state --state prod-state

      # if: always() ensures artefacts upload even when the build fails — the
      # failed run_results.json is exactly what we want for post-mortem.
      - name: Upload dbt artefacts to GCS
        if: always()
        run: |
          BUCKET=gs://dbt-test-jaffleshop-dbt-artefacts
          RUN_PREFIX=runs/${{ github.run_id }}
          for f in manifest.json run_results.json catalog.json; do
            if [ -f "target/$f" ]; then
              gcloud storage cp "target/$f" "$BUCKET/$RUN_PREFIX/$f"
            fi
          done
