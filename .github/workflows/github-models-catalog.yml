name: github models catalog

# =============================================================================
# On-demand: dump the LIVE GitHub Models catalogue using the runner's GITHUB_TOKEN
# (permissions: models: read) so the model listing is authoritative and reproducible,
# not scraped or hand-maintained. The catalogue is emitted three ways:
#   - the step log (a plain table — easy to read/extract from the run log)
#   - the job summary (a markdown table)
#   - an uploaded artifact (the raw catalog.json)
#
# NOTE: the catalogue API exposes id / publisher / rate_limit_tier / context limits /
# capabilities / modalities — but NO pricing. GitHub Models pricing is the billing
# *multiplier* table (docs.github.com/billing/reference/costs-for-github-models);
# effective $/1M = multiplier × $10. There is no pricing API to read here.
#
# Dispatch:  gh workflow run "github models catalog" --ref main
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  catalog:
    name: dump GitHub Models catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Fetch catalogue (GITHUB_TOKEN, models:read)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/json" \
            https://models.github.ai/catalog/models > catalog.json

          n=$(jq 'length' catalog.json)
          echo "::notice::GitHub Models catalogue: $n models"
          echo "=== CATALOGUE ($n models) — id | publisher | tier | ctx_in | ctx_out | input_modalities | capabilities ==="
          jq -r '.[]
            | [ .id, .publisher, .rate_limit_tier,
                (.limits.max_input_tokens|tostring), (.limits.max_output_tokens|tostring),
                (.supported_input_modalities|join("+")), (.capabilities|join("+")) ]
            | @tsv' catalog.json | sort | column -t -s "$(printf '\t')"

          # Markdown table → job summary
          {
            echo "## GitHub Models catalogue — $n models"
            echo ""
            echo "_Fetched live via \`GITHUB_TOKEN\` (models:read). The catalogue carries no pricing;"
            echo "see GitHub Models billing multipliers (\$/1M = multiplier × \$10)._"
            echo ""
            echo "| id | publisher | tier | ctx in | ctx out | input | capabilities |"
            echo "|---|---|---|--:|--:|---|---|"
            jq -r '.[]
              | "| `\(.id)` | \(.publisher) | \(.rate_limit_tier) | \(.limits.max_input_tokens) | \(.limits.max_output_tokens) | \(.supported_input_modalities|join(", ")) | \(.capabilities|join(", ")) |"' \
              catalog.json | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw catalog.json
        uses: actions/upload-artifact@v7
        with:
          name: github-models-catalog
          path: catalog.json
