name: github models catalog

# =============================================================================
# On-demand: dump the LIVE GitHub Models catalogue AND the billing-multiplier table, so both
# the listings and the pricing are authoritative + reproducible (not hand-maintained). Each is
# emitted to the step log, the job summary, and an uploaded artifact.
#
# TWO sources, because no single endpoint has both:
#   - LISTINGS — the catalogue API (https://models.github.ai/catalog/models) via GITHUB_TOKEN
#     (models: read): id / publisher / rate_limit_tier / context limits / capabilities /
#     modalities. It has NO pricing.
#   - PRICING — the billing *multipliers* live in GitHub's docs source (github/docs →
#     content/billing/reference/costs-for-github-models.md), public + parseable. There is no
#     pricing API, so we read the canonical doc source directly. Effective $/1M = multiplier × $10
#     (the doc also lists precomputed prices). Join the two by model name to get listing + price.
#
# Dispatch:  gh workflow run "github models catalog" --ref main
# =============================================================================

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  catalog:
    name: dump GitHub Models catalogue
    runs-on: ubuntu-latest
    steps:
      - name: Fetch catalogue (GITHUB_TOKEN, models:read)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The catalogue shares the Models rate limit; retry on 429/5xx, honouring Retry-After.
          curl -sS --fail \
            --retry 6 --retry-delay 30 --retry-all-errors --retry-max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/json" \
            https://models.github.ai/catalog/models > catalog.json

          n=$(jq 'length' catalog.json)
          echo "::notice::GitHub Models catalogue: $n models"
          echo "=== CATALOGUE ($n models) — id | publisher | tier | ctx_in | ctx_out | input_modalities | capabilities ==="
          jq -r '.[]
            | [ .id, .publisher, .rate_limit_tier,
                (.limits.max_input_tokens|tostring), (.limits.max_output_tokens|tostring),
                (.supported_input_modalities|join("+")), (.capabilities|join("+")) ]
            | @tsv' catalog.json | sort | column -t -s "$(printf '\t')"

          # Markdown table → job summary
          {
            echo "## GitHub Models catalogue — $n models"
            echo ""
            echo "_Fetched live via \`GITHUB_TOKEN\` (models:read). The catalogue carries no pricing;"
            echo "see GitHub Models billing multipliers (\$/1M = multiplier × \$10)._"
            echo ""
            echo "| id | publisher | tier | ctx in | ctx out | input | capabilities |"
            echo "|---|---|---|--:|--:|---|---|"
            jq -r '.[]
              | "| `\(.id)` | \(.publisher) | \(.rate_limit_tier) | \(.limits.max_input_tokens) | \(.limits.max_output_tokens) | \(.supported_input_modalities|join(", ")) | \(.capabilities|join(", ")) |"' \
              catalog.json | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch billing multipliers (github/docs source)
        run: |
          set -euo pipefail
          # The catalogue API has no pricing. The authoritative multipliers live in GitHub's
          # docs source (the same data rendered at docs.github.com), which is public + parseable.
          # Effective $/1M = input/output multiplier × $10 (the doc also precomputes the prices).
          curl -sS --fail --retry 4 --retry-delay 10 --retry-all-errors \
            https://raw.githubusercontent.com/github/docs/main/content/billing/reference/costs-for-github-models.md \
            > costs.md

          # Extract the markdown table (header row through the first non-table line).
          awk '/^\| *Model name/{p=1} p{ if ($0 !~ /^\|/) exit; print }' costs.md > multipliers.md
          rows=$(($(wc -l < multipliers.md) - 2))   # minus header + separator
          echo "::notice::Billing multipliers: $rows models priced"
          echo "=== BILLING MULTIPLIERS ($rows models) — \$/1M = multiplier × \$10 ==="
          cat multipliers.md

          {
            echo ""
            echo "## GitHub Models billing multipliers — $rows models"
            echo ""
            echo "_Source: \`github/docs\` → \`content/billing/reference/costs-for-github-models.md\` (live)._"
            echo "_Effective \$/1M = multiplier × \$10; the table also lists precomputed prices._"
            echo ""
            cat multipliers.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload catalogue + multipliers
        uses: actions/upload-artifact@v7
        with:
          name: github-models-catalog
          path: |
            catalog.json
            costs.md
            multipliers.md
