name: dbt testing-taxonomy review
description: >-
  Thin wrapper over `adaf review` (the Automated Data Assurance Framework CLI): review a PR's dbt
  models against the testing-taxonomy catalogue via GitHub Models (keyless, GITHUB_TOKEN) and upsert
  the changed + all coverage-matrix PR comments with token usage and estimated cost. The engine,
  rule catalogue, and prompt all live in `.github/cli/adaf` — this action just invokes it.

inputs:
  github-token:
    description: Token with models:read + pull-requests:write (pass secrets.GITHUB_TOKEN).
    required: true
  pr-number:
    description: Pull request number to comment on.
    required: true
  base-sha:
    description: Base commit SHA — the changed-models diff is merge-base(base-sha, HEAD).
    required: true
  project-dir:
    description: Path (relative to the workspace) to the dbt project holding dbt_project.yml + models/.
    required: false
    default: dbt-jaffleshop
  model:
    description: GitHub Models catalogue id (must support response_format json_schema).
    required: false
    default: openai/gpt-4.1-mini
  models-endpoint:
    description: GitHub Models inference endpoint.
    required: false
    default: https://models.github.ai/inference
  cost-per-1m-input:
    description: USD per 1M input tokens, for the estimated-cost line (model list price).
    required: false
    default: "0.4"
  cost-per-1m-output:
    description: USD per 1M output tokens, for the estimated-cost line (model list price).
    required: false
    default: "1.60"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v8.1.0

    - name: Run testing-taxonomy review (adaf review --post)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # GITHUB_REPOSITORY + PR context the engine reads for --post:
        PR_NUMBER: ${{ inputs.pr-number }}
      # adaf runs in its OWN venv (it needs no dbt toolchain for `review`): --directory points uv at
      # the adaf project; --project-dir points adaf at the dbt project for model discovery + adaf.yml.
      run: >-
        uv run --directory "${{ github.action_path }}/../../cli/adaf" adaf review
        --all --post
        --project-dir "${{ github.workspace }}/${{ inputs.project-dir }}"
        --base-ref "${{ inputs.base-sha }}"
        --model "${{ inputs.model }}"
        --endpoint "${{ inputs.models-endpoint }}"
        --cost-per-1m-input "${{ inputs.cost-per-1m-input }}"
        --cost-per-1m-output "${{ inputs.cost-per-1m-output }}"
