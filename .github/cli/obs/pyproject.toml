[project]
name = "obs"
version = "0.1.0"
description = "obs — dbt observability CLI over the prod Elementary telemetry: extract run telemetry to JSON, render interactive viewers (Gantt-by-thread first)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-auth>=2.30",
    "python-dotenv>=1.0",
    "typer>=0.26.7",
]

[project.scripts]
obs = "obs.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src-layout: the importable package is src/obs. Hatchling ships every file under it —
# including the non-.py viewer templates in src/obs/assets/ — into the wheel, so the
# templates resolve via a package-relative path whether run from source (`uv run`) or
# installed (`uvx --from .github/cli/obs obs ...`).
[tool.hatch.build.targets.wheel]
packages = ["src/obs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Browser-driving e2e suite for the generated static SPA. Isolated from `dev` so the
# fast `make ci` loop never pulls Playwright. Run with: make test-e2e (installs chromium).
e2e = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
