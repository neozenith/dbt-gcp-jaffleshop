# Generated/maintained via `adaf gha create <product>` from the CLI's base workflow template.
# Thin per-product caller: the parallel job graph lives in .github/workflows/adaf-reusable.yml
# (deployed by `adaf gha init`).
name: adaf - __PRODUCT__

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # NOTE: derived from the selector by `adaf gha create` (collapsed per --paths). Refine if needed.
      - 'models/**'
      - 'dbt_project.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The caller grants the permissions the reusable workflow's jobs need (a reusable workflow can't
# escalate beyond its caller): WIF auth + the sticky PR comment.
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  adaf:
    name: adaf / __PRODUCT__ # prefixes every reusable-workflow job (-> "adaf / <product> / <job>")
    uses: ./.github/workflows/adaf-reusable.yml
    with:
      selector: __PRODUCT__
      # target: dev   # dbt target (default: dev)
      # build_downstream: 'false'   # build ONLY the changed models (default 'true' = + all descendants)
      # --- Per-check opt-outs: uncomment a line and set 'false' to skip that check for this product. ---
      # run_sqlfluff: 'true'
      # run_deprecations: 'true'
      # run_docscov: 'true'
      # run_testcov: 'true'
      # run_sdag_check: 'true'
