[project]
name = "adaf"
version = "0.2.0"
description = "ADAF — Automated Data Assurance Framework CLI: sqlfluff + dbt-autofix gates, coverage, and the sdag lineage viewer over a named-selector scope."
requires-python = ">=3.12"
# Few-deps by design (fewest deps, lean on the stdlib) — but reach for a mature FOSS primitive
# rather than reinvent one. 
# - ruamel.yaml: comment/order-preserving YAML round-trip (selectors.yml + the gha workflow template).
# - networkx: the lineage DAG + traversals (don't hand-roll graph algorithms). See AGENTS.md ADR-0002.
#   Pinned >=2.3 (not >=3.0): adaf touches only the stable core DiGraph API (add_*_from, nodes/edges,
#   predecessors/successors, has_node) which is identical across 2.x/3.x, and elementary-data caps
#   networkx<3 — the wider floor lets `edr` coexist in the same venv. See AGENTS.md ADR-0002.
# - elementary-data: provides the `edr` CLI the adaf-report composite action shells out to
#   (`edr report`). A runtime tool dep, not imported by adaf source.
dependencies = [
    "ruamel.yaml>=0.18",
    "networkx>=2.3",
    "elementary-data>=0.16",
]

[project.optional-dependencies]
# Feature-gated dbt v2.0 ("Fusion") parquet artifact reader (ParquetManifestArtifact). duckdb is
# imported ONLY inside that class — the JSON path (every user today) stays duckdb-free. Not in core
# or dev deps. See docs/todo/dbt-fusion.md (ADR-0002: a dependency only where stdlib genuinely can't).
fusion = ["duckdb>=1.0"]

[project.scripts]
adaf = "adaf.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaf"]

[dependency-groups]
# testcontainers (+ the docker SDK it drives) is a HARD dev dependency, not an optional extra: the
# dbt version-matrix suite (tests/multiversion/test_multiversion.py) REQUIRES it and must error loudly — never
# skip — if it is missing (escalators-not-stairs). It lives in `dev` so the test env ALWAYS has it; the
# suite is kept off `make ci` purely by the `multiversion` marker (addopts `-m 'not multiversion'`),
# which is environment economy (ci stays fast/offline/Docker-free), NOT requirement degradation.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers>=4.0",
    "docker>=7.0",
    "packaging>=26.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The Docker-backed dbt version-matrix suite is marked `multiversion` and DESELECTED by default, so
# `uv run pytest` (and `make ci`) stays fast, offline, and Docker-free. The adaf-multiversion-ci
# target re-selects it with an explicit `-m multiversion` (a CLI -m overrides this addopts -m).
# testcontainers is a hard dev dep (imported unconditionally at module top, no importorskip), so the
# suite errors loudly if it is ever missing — deselection, never a silent skip, keeps it off ci.
addopts = "-m 'not multiversion'"
markers = [
    "multiversion: dbt version-matrix integration tests (build + run one Docker image per dbt engine; off ci)",
]

[tool.ruff]
line-length = 120
src = ["src"]
# The composite-action assets under gha/assets/actions are VERBATIM vendored copies shipped as package
# data (deployed by `adaf gha init`), not first-party source — they live by the consuming repo's own
# conventions, so they're excluded from our lint/format/type gates.
extend-exclude = ["src/adaf/gha/assets/actions"]

[tool.ruff.lint]
# Sensible default rule set: pyflakes (F), pycodestyle (E/W), isort (I), bugbear (B),
# comprehensions (C4), pyupgrade (UP), naming (N).
select = ["E", "F", "W", "I", "B", "C4", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/adaf"]
# Exclude the vendored composite-action assets (verbatim copies, not first-party source — see ruff above).
exclude = ["src/adaf/gha/assets/actions/"]
# argparse handlers receive an untyped Namespace; that's the one ergonomic exception.
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["networkx.*", "duckdb.*"]
ignore_missing_imports = true
