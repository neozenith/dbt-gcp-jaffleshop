# Intentionally-broken dbt project — the eval/test fixture for ADAF's deterministic detectors.
# Decoupled from the production `dbt-jaffleshop` project (which is now clean) so the evals can keep
# asserting that gaps are detected without any production model needing to stay broken.
#
# The gaps are deliberate: products/supplies/locations have no grain test (MD-01), the three sources
# have no freshness SLA (TM-AU-01), and the marts have no enforced contract (MD-02). metricflow_time_spine
# is a genuine false positive, suppressed in adaf.yml. Regenerate the manifest after editing models with:
#   uv run --directory dbt-jaffleshop dbt parse \
#     --project-dir .github/cli/adaf/tests/fixtures/broken_taxonomy \
#     --profiles-dir .github/cli/adaf/tests/fixtures/broken_taxonomy
name: broken_taxonomy_fixture
version: "1.0.0"
profile: broken_taxonomy_fixture
model-paths: ["models"]
