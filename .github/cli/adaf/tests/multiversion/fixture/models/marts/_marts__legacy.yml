version: 2

# LEGACY-spec marts: NO inline `semantic_model:` — dim_customers is backed by the standalone
# _semantic_models__dbt1-11-11.yml resource. Staged ONLY into the dbt1-11-11 context.
models:
  # Outbound boundary node that satisfies every outbound obligation:
  #   MD-02 enforced contract, MD-11 exposure, MD-12 semantic model.
  - name: dim_customers
    description: "Customer dimension — one row per customer. Fully governed outbound node."
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        description: "Customer key."
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: order_count
        description: "Number of orders for the customer."
        data_type: integer
      - name: created_at
        description: "Most recent order timestamp for the customer."
        data_type: timestamp

  # Outbound boundary node missing a semantic model (violates MD-12), no description (docscov gap)
  # and no tests (testcov gap). Keeps an enforced contract (MD-02 ok) + exposure (MD-11 ok).
  - name: fct_orders
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: integer
      - name: customer_id
        data_type: integer
      - name: order_total
        data_type: double
      - name: created_at
        data_type: timestamp
